<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收餐費工具</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      background-color: #f7f9fa;
      color: #333;
    }
    h2 {
      text-align: center;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:active {
      background-color: #0056b3;
    }
    .stats {
      margin: 16px 0 8px 0;
      font-size: 14px;
      color: #555;
      display: flex;
      justify-content: space-between;
    }
    .dept-title {
      font-size: 15px;
      font-weight: bold;
      color: #666;
      margin: 16px 0 6px 4px;
      padding-left: 6px;
      border-left: 4px solid #007aff;
    }
    .list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    /* 收款按鈕樣式 */
    .pay-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #ffffff;
      border: 2px solid #000000;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 500;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .pay-btn:active {
      transform: scale(0.99);
    }
    /* 已收款狀態（變灰、劃掉、半透明） */
    .pay-btn.paid {
      background-color: #e5e5ea;
      border-color: #bbb;
      color: #8e8e93;
      text-decoration: line-through;
      opacity: 0.6;
    }
    .amount {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>收餐費工具</h2>
  <textarea id="inputText" placeholder="貼上文字..."></textarea>
  <button class="btn-submit" onclick="parseList()">確認</button>

  <div class="stats" id="stats"></div>
  <div class="list-container" id="btnContainer"></div>

  <script>
    function parseList() {
      const text = document.getElementById('inputText').value;
      const lines = text.split('\n');
      const container = document.getElementById('btnContainer');
      container.innerHTML = '';

      let items = [];

      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;

        // 1. 去除開頭序號 (如 "1.", "1 ", "1、")
        trimmed = trimmed.replace(/^\d+[\.\、\s]*/, '');

        // 2. 擷取姓名/科室（冒號前的文字，若無冒號則抓第一個空格前）
        let nameMatch = trimmed.match(/^([^:：]+)[：:]/);
        let fullName = '';
        if (nameMatch) {
          fullName = nameMatch[1].trim();
        } else {
          let parts = trimmed.split(/\s+/);
          fullName = parts[0];
        }

        // 3. 擷取單位 (支援 (科室) 或 （科室）)
        let deptMatch = fullName.match(/[\(（](.+?)[\)）]/);
        let dept = deptMatch ? deptMatch[1].trim() : '其他';

        // 4. 擷取金額（行末最後一串數字）
        let amountMatch = trimmed.match(/(\d+)\s*$/);
        let amount = amountMatch ? amountMatch[1] : '';

        if (fullName && amount) {
          items.push({ dept, fullName, amount });
        }
      });

      // 依單位排序
      items.sort((a, b) => a.dept.localeCompare(b.dept, 'zh-Hant'));

      // 依單位分組呈現
      let currentDept = '';
      items.forEach(item => {
        // 切換單位時插入分組標題
        if (item.dept !== currentDept) {
          currentDept = item.dept;
          const deptHeader = document.createElement('div');
          deptHeader.className = 'dept-title';
          deptHeader.textContent = currentDept;
          container.appendChild(deptHeader);
        }

        const btn = document.createElement('button');
        btn.className = 'pay-btn';
        btn.innerHTML = `<span>${item.fullName}</span><span class="amount">${item.amount}</span>`;
        
        btn.onclick = function() {
          this.classList.toggle('paid');
          updateStats();
        };

        container.appendChild(btn);
      });

      updateStats();
    }

    function updateStats() {
      const allBtns = document.querySelectorAll('.pay-btn');
      const paidBtns = document.querySelectorAll('.pay-btn.paid');
      const stats = document.getElementById('stats');

      if (allBtns.length > 0) {
        stats.innerHTML = `<span>已收：${paidBtns.length} / ${allBtns.length} 人</span>`;
      } else {
        stats.innerHTML = '';
      }
    }
  </script>
</body>
</html>
